name: squaremap-SimpleClans
version: '${version}'
main: net.sacredlabyrinth.phaed.squaremap.simpleclans.SquaremapSimpleClans
description: '${description}'
website: https://github.com/wamble-panel/squaremap-SimpleClans
authors: [phaed, RoinujNosde, Minat0_]
api-version: '1.21'
depend: [squaremap, SimpleClans]

# Commands are registered through Paper's Brigadier API (see ClanMapCommand).
permissions:
  simpleclans.map.seticon:
    description: Clan leaders can pick their clan's map icon with /clanmap icon
    default: true
  simpleclans.map.list:
    description: List available icons with /clanmap icons
    default: true
  simpleclans.map.icon.clanhome:
    description: Use the bundled clanhome icon
    default: true
  simpleclans.map.icon.bypass:
    description: Use any icon without its simpleclans.map.icon.<name> permission
    default: op
  simpleclans.map.hide:
    description: Clan leaders can hide their clan from the map with /clanmap hide
    default: op
  simpleclans.map.reload:
    description: Reload the plugin with /clanmap reload
    default: op
