name: squaremap-SimpleClans
version: '${version}'
main: net.sacredlabyrinth.phaed.squaremap.simpleclans.SquaremapSimpleClans
description: '${description}'
website: https://github.com/wamble-panel/squaremap-SimpleClans
authors: [phaed, RoinujNosde, Minat0_]
api-version: '1.21'
depend: [squaremap, SimpleClans]

# Commands are registered through Paper's Brigadier API (see ClanMapCommand).
permissions:
  simpleclans.map.seticon:
    description: Clan leaders can open the icon picker with /clanmap icon
    default: true
  simpleclans.map.list:
    description: List available icons with /clanmap icons
    default: true
  simpleclans.map.icon.banners:
    description: Use every banner icon
    default: false
    children:
      simpleclans.map.icon.banner_white: true
      simpleclans.map.icon.banner_light_gray: true
      simpleclans.map.icon.banner_gray: true
      simpleclans.map.icon.banner_black: true
      simpleclans.map.icon.banner_brown: true
      simpleclans.map.icon.banner_red: true
      simpleclans.map.icon.banner_orange: true
      simpleclans.map.icon.banner_yellow: true
      simpleclans.map.icon.banner_lime: true
      simpleclans.map.icon.banner_green: true
      simpleclans.map.icon.banner_cyan: true
      simpleclans.map.icon.banner_light_blue: true
      simpleclans.map.icon.banner_blue: true
      simpleclans.map.icon.banner_purple: true
      simpleclans.map.icon.banner_magenta: true
      simpleclans.map.icon.banner_pink: true
  simpleclans.map.icon.banner_white:
    description: Use the white banner icon
    default: false
  simpleclans.map.icon.banner_light_gray:
    description: Use the light gray banner icon
    default: false
  simpleclans.map.icon.banner_gray:
    description: Use the gray banner icon
    default: false
  simpleclans.map.icon.banner_black:
    description: Use the black banner icon
    default: false
  simpleclans.map.icon.banner_brown:
    description: Use the brown banner icon
    default: false
  simpleclans.map.icon.banner_red:
    description: Use the red banner icon
    default: false
  simpleclans.map.icon.banner_orange:
    description: Use the orange banner icon
    default: false
  simpleclans.map.icon.banner_yellow:
    description: Use the yellow banner icon
    default: false
  simpleclans.map.icon.banner_lime:
    description: Use the lime banner icon
    default: false
  simpleclans.map.icon.banner_green:
    description: Use the green banner icon
    default: false
  simpleclans.map.icon.banner_cyan:
    description: Use the cyan banner icon
    default: false
  simpleclans.map.icon.banner_light_blue:
    description: Use the light blue banner icon
    default: false
  simpleclans.map.icon.banner_blue:
    description: Use the blue banner icon
    default: false
  simpleclans.map.icon.banner_purple:
    description: Use the purple banner icon
    default: false
  simpleclans.map.icon.banner_magenta:
    description: Use the magenta banner icon
    default: false
  simpleclans.map.icon.banner_pink:
    description: Use the pink banner icon
    default: false
  simpleclans.map.icon.bypass:
    description: Use any icon without its simpleclans.map.icon.<name> permission
    default: op
  simpleclans.map.hide:
    description: Clan leaders can hide their clan from the map with /clanmap hide
    default: op
  simpleclans.map.reload:
    description: Reload the plugin with /clanmap reload
    default: op
