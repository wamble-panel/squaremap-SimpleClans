# squaremap-SimpleClans
# Shows SimpleClans homes, territory and recent kills on squaremap.
# Run /clanmap reload after editing.

# Don't change this; it lets the plugin know when your config needs migrating.
config-version: 2

# Log extra details to help track down problems.
debug: false

# What clan markers show. Hovering shows the clan tag, name and who is online;
# clicking opens a popup with the rows below.
tooltip:
  # Popup rows, top to bottom. Rows with nothing to show (no allies, no wars...) are skipped.
  # Available: leaders, members, kdr, kills, allies, rivals, wars, territory, founded, description
  rows: [leaders, members, kdr, allies, rivals, wars, territory, description]

  # How many players or clans a row lists before collapsing the rest into "+N more".
  max-listed: 5

  # Head images shown next to player names. {uuid} and {name} are replaced.
  # This is the same service squaremap's player list uses. Set to "" to show names only.
  head-url: "https://mc-heads.net/avatar/{uuid}/16"

  # Java DateTimeFormatter pattern for the "founded" row.
  date-format: "d MMM yyyy"

  # Wording used in tooltips, for translating.
  labels:
    leaders: "Leaders"
    members: "Members"
    online: "online"
    kdr: "KDR"
    kills: "Kills"
    deaths: "deaths"
    allies: "Allies"
    rivals: "Rivals"
    wars: "At war"
    territory: "Territory"
    claim: "claim"
    claims: "claims"
    blocks: "blocks"
    founded: "Founded"
    more: "+{count} more"
    kill-civilian: "Civilian kill"
    kill-neutral: "Kill"
    kill-rival: "Rival kill"
    kill-ally: "Ally kill"
    kill-war: "War kill"

# Every layer has these settings:
#   enabled                  turn the layer on or off
#   label                    name in squaremap's layer list
#   show-controls            list the layer in squaremap's layer control
#   default-hidden           start with the layer switched off for visitors
#   layer-priority           order in the layer list (lower comes first)
#   z-index                  drawing order between layers (higher is on top)
#   update-interval-seconds  how often everything is redrawn; changes like a new home
#                            show straight away regardless
#   hidden-worlds            world names this layer never appears on
layers:
  homes:
    enabled: true
    label: "Clan Homes"
    show-controls: true
    default-hidden: false
    layer-priority: 20
    z-index: 20
    update-interval-seconds: 30
    hidden-worlds: []
    # Icon size on the map, in pixels.
    icon-size: 32
    # Icon clans get until a leader picks another. Built in: one banner per dye colour
    #   banner_white, banner_light_gray, banner_gray, banner_black, banner_brown, banner_red,
    #   banner_orange, banner_yellow, banner_lime, banner_green, banner_cyan, banner_light_blue,
    #   banner_blue, banner_purple, banner_magenta, banner_pink
    # Add your own by putting PNGs in plugins/squaremap-SimpleClans/icons/ (file name = icon name).
    # Each icon needs simpleclans.map.icon.<name>; the default icon is free for everyone.
    default-icon: "banner_red"
    # Clan tags that never appear. Leaders can also hide their own clan with /clanmap hide.
    hidden-clans: []

  lands:
    enabled: true
    label: "Clan Territory"
    show-controls: true
    default-hidden: false
    layer-priority: 10
    z-index: 10
    # Territory comes from your protection plugin (WorldGuard, GriefPrevention, ...) through
    # SimpleClans' land hooks. Looking it up is heavier than the other layers, so it runs less often.
    update-interval-seconds: 300
    hidden-worlds: []
    hidden-clans: []
    # Whose claims count as clan territory: "leaders" or "members".
    territory-owners: leaders
    style:
      # Colour territory with the clan's tag colour; the colours below are used when off
      # or when the tag has no colour.
      color-from-tag: true
      fill-color: "#57B356"
      fill-opacity: 0.25
      stroke-color: "#2D682D"
      stroke-opacity: 0.9
      stroke-weight: 2

  kills:
    enabled: true
    label: "Recent Kills"
    show-controls: true
    default-hidden: false
    layer-priority: 30
    z-index: 30
    hidden-worlds: []
    # How long a kill stays on the map.
    duration-seconds: 300
    # Oldest kills are removed once there are this many.
    max-markers: 100
    icon-size: 16
    # Java DateTimeFormatter pattern for the time shown on a kill.
    time-format: "HH:mm"
    # Which kills to show: civilian (victim has no clan), neutral, rival, ally, war
    types: [civilian, neutral, rival, ally, war]
    # The kill icon can be replaced by putting a kill.png in the plugin folder.

# The icon picker clan leaders open with /clanmap icon.
menu:
  # Also list icons the player hasn't unlocked (shown greyed out with a lock), so they know what exists.
  show-locked: true
  # Banner icons show as the banner of the same colour. Custom icons show as this item...
  custom-icon-item: PAINTING
  # ...unless you pick one here, by icon name. Works for banners too.
  items: {}
  #   castle: STONE_BRICKS
  #   dragon: DRAGON_HEAD

# Chat and menu text, in MiniMessage format: https://docs.advntr.dev/minimessage/format
# Hex colours (<#RRGGBB>) and gradients (<gradient:#FFD166:#F28C38>...</gradient>) work everywhere.
# <prefix> inserts the prefix. Set a message to "" to send nothing.
#
# The default palette:
#   gold #FFD166   green #7BD88F   red #FF6B6B   blue #6CC4FF   text #C8CDD2   muted #8A9096
messages:
  prefix: "<#4A4F55>[<gradient:#FFD166:#F28C38>ClanMap</gradient><#4A4F55>]</#4A4F55> "
  no-permission: "<prefix><#FF6B6B>You don't have permission to do that."
  players-only: "<prefix><#FF6B6B>Only players can do that."
  not-in-clan: "<prefix><#FF6B6B>You need to be in a clan."
  not-leader: "<prefix><#FF6B6B>Only clan leaders can change how the clan shows on the map."
  layer-disabled: "<prefix><#FF6B6B>The clan homes layer is turned off."
  reloaded: "<prefix><#7BD88F>Reloaded."
  reload-failed: "<prefix><#FF6B6B>Reload failed; check the console."
  icon-changed: "<prefix><#C8CDD2>Your clan's map icon is now <#6CC4FF><icon></#6CC4FF>."
  icon-reset: "<prefix><#C8CDD2>Your clan's map icon is back to the default."
  icon-not-found: "<prefix><#FF6B6B>There's no icon called <#C8CDD2><icon></#C8CDD2>. See <#FFD166>/clanmap icons</#FFD166>."
  icons-header: "<prefix><#8A9096>Icons you can use (<#FFD166><count></#FFD166>), click one to pick it:"
  icons-hover: "<#8A9096>Use <#6CC4FF><icon></#6CC4FF> for your clan"
  icons-empty: "<prefix><#8A9096>There are no icons you can use."
  clan-hidden: "<prefix><#FFD166>Your clan is now hidden from the map."
  clan-shown: "<prefix><#7BD88F>Your clan is visible on the map again."
  help:
    header: "<prefix><#8A9096>squaremap-SimpleClans commands:"
    icon: "<#4A4F55> • <#FFD166>/clanmap icon</#FFD166> <#4A4F55>-</#4A4F55> <#C8CDD2>open the icon picker <#4A4F55>(or <#FFD166>/clanmap icon [name|reset]</#FFD166>)"
    icons: "<#4A4F55> • <#FFD166>/clanmap icons</#FFD166> <#4A4F55>-</#4A4F55> <#C8CDD2>list icons"
    hide: "<#4A4F55> • <#FFD166>/clanmap hide</#FFD166> / <#FFD166>show</#FFD166> <#4A4F55>-</#4A4F55> <#C8CDD2>hide your clan from the map"
    reload: "<#4A4F55> • <#FFD166>/clanmap reload</#FFD166> <#4A4F55>-</#4A4F55> <#C8CDD2>reload the config"
  # The icon picker (/clanmap icon).
  # <icon> is the icon's name in its own colour, <swatch> a block of that colour and <hex> its #RRGGBB code.
  menu:
    title: "<gradient:#FFD166:#F28C38>Clan Map Icon</gradient> <#4A4F55>·</#4A4F55> <clan>"
    info-icon: "<#8A9096>Icon <#4A4F55>»</#4A4F55> <icon>"
    info-color: "<#8A9096>Colour <#4A4F55>»</#4A4F55> <swatch> <#C8CDD2><hex>"
    info-unlocked: "<#8A9096>Unlocked <#4A4F55>»</#4A4F55> <#FFD166><unlocked></#FFD166><#4A4F55>/</#4A4F55><#C8CDD2><total>"
    info-shown: "<#7BD88F>● <#C8CDD2>Visible on the map"
    info-hidden: "<#FF6B6B>● <#C8CDD2>Hidden from the map"
    icon-color: "<swatch> <#8A9096><hex>"
    icon-selected: "<#7BD88F>✔ Your clan's icon"
    icon-available: "<#FFD166>▸ Click to use"
    icon-locked: "<#FF6B6B>✖ Locked"
    icon-locked-hint: "<#8A9096>Ask staff how to unlock it"
    icon-default: "<#4A4F55>Default icon"
    selected-feedback: "<#C8CDD2>Your clan's map icon is now <icon><#C8CDD2>."
    locked-feedback: "<#FF6B6B>You haven't unlocked <icon><#FF6B6B> yet."
    reset: "<#FFD166>Reset icon"
    reset-lore: "<#8A9096>Back to <icon>"
    shown: "<#7BD88F>Visible on the map"
    hidden: "<#FF6B6B>Hidden from the map"
    click-to-hide: "<#8A9096>Click to hide your clan"
    click-to-show: "<#8A9096>Click to show your clan"
    previous: "<#FFD166>← Previous page"
    next: "<#FFD166>Next page →"
    page: "<#8A9096>Page <#C8CDD2><page></#C8CDD2> of <#C8CDD2><pages>"
    close: "<#FF6B6B>Close"
