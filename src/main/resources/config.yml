# squaremap-SimpleClans configuration
debug: false

language:
  layer-disabled: "&cThat layer is disabled!"
  no-permission: "&cYou don't have permission to do that!"
  reloaded: "&aPlugin reloaded successfully!"
  not-member: "&cYou must be a member of a clan to use this command."
  icon-changed: "&bClan icon updated! Changes will appear on the map shortly."
  icon-not-found: "&cIcon not found. Use /clanmap seticon <tab> to list available icons."
  error-reload: "&cAn error occurred while reloading the plugin!"
  fee-enabled: "enabled"
  fee-disabled: "disabled"
  verified: "verified"
  unverified: "unverified"

help-command:
  - "&b[squaremap-SimpleClans] Commands:"
  - "&b/clanmap seticon <name> &7- Set your clan's map icon (leader only)"
  - "&c/clanmap reload &7- Reload the plugin and configuration"
  - "&b/clanmap help &7- Show this help"

layer:
  lands:
    enable: true
    label: "Clan Lands"                   # Layer name shown in the squaremap sidebar
    format: "{clan} &8(territory)"        # Click-tooltip label. Placeholders: {clan} {tag} {member_count} {founded} {rival} {neutral} {deaths} {kdr} {civilian} {members_online} {leaders} {allies} {rivals} {fee_value} {status} {fee_enabled} {inactive}. Colors: &1. Newline: |
    layer-priority: 1                     # Higher = listed first in sidebar
    hide-by-default: false
    min-zoom: 0
    hidden-lands: []                      # Clan tags to completely hide from this layer
    style:
      based-on-tag: false                 # When true, fill/line colours are taken from the clan's tag colour
      fill:
        color: "#57b356"                  # Hex fill colour when based-on-tag is false
        opacity: 0.35                     # 0.0 – 1.0
      line:
        color: "#2d682d"                  # Hex border colour when based-on-tag is false
        opacity: 0.8
        weight: 3                         # Border width in pixels

  homes:
    enable: true
    default-icon: "clanhome"              # Icon name (no extension) used when a clan hasn't chosen one
    label: "Clan Homes"
    format: "{clan} &8(home)"
    layer-priority: 10
    hide-by-default: false
    min-zoom: 0
    hidden-markers: []                    # Clan tags or "world:<worldname>" entries to hide

  kills:
    enable: true
    label: "Deaths"
    format: |
      <table style='text-align:center;'>
        <tr>
          <th style='color:#da282f;padding:0.5em;'>{attacker}</th>
          <th>&#9876;&#65039;</th>
          <th style='color:#2863e8;padding:0.5em;'>{victim}</th>
        </tr>
        <tr>
          <td>({atag})</td>
          <td>[{time}]</td>
          <td>({vtag})</td>
        </tr>
      </table>
    time-format: "HH:mm:ss"              # DateTimeFormatter pattern for {time}
    layer-priority: 20
    hide-by-default: false
    min-zoom: 0
    visible-seconds: 300                  # How long each kill marker stays on the map
    hide:
      clan-players: false                 # Don't show deaths of clan members
      civilians: false                    # Don't show deaths of players without a clan
